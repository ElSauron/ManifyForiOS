services:
  - type: web
    name: manify-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      # İsteğe bağlı: API_KEY tanımlarsan her istek anahtar ister; tanımlamazsan anahtarsız çalışır.
      # - key: API_KEY
      #   sync: false
      # İsteğe bağlı (IP engeli olursa lazım olur):
      # - key: YT_COOKIE
      #   sync: false
      # - key: PO_TOKEN
      #   sync: false
      # - key: VISITOR_DATA
      #   sync: false
      # - key: ALLOWED_ORIGIN
      #   value: https://SENIN-PWA-ADRESIN
